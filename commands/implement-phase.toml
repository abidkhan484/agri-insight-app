[command]
name        = "implement-phase"
description = "Run the full 5-agent pipeline (coder → qa → reviewer → doc-updater → committer) for a single phase or feature module."
usage       = "@implement-phase phase=bot"

[parameters]
phase = { type = "string", required = true,  description = "Phase or module identifier, e.g. bot, weather, P1, or P9" }
scope = { type = "string", required = false, description = "Optional narrowing — e.g. 'bot commands only'. Omit for full phase/module." }

[steps]

  [steps.1_coder]
  agent       = "coder"
  instruction = "Implement {phase}{scope_clause}. Read tasks/{phase_slug}.md fully if it exists, then skills/{phase_slug}/SKILL.md if it exists, then skills/zbnf-formulation/SKILL.md if farming logic is involved."
  reads       = ["tasks/{phase_slug}.md", "skills/{phase_slug}/SKILL.md", "skills/zbnf-formulation/SKILL.md", "CLAUDE.md"]
  gate        = "All subtasks in the task checklist checked off; ESLint-clean code; no console.log; Winston/loglevel/structlog used."

  [steps.2_qa]
  agent       = "qa"
  instruction = "Write and run tests for {phase}. Verify all ZBNF formulation outputs against exact values in skills/zbnf-formulation/SKILL.md if applicable. Check Bangla text presence and logger calls."
  reads       = ["skills/zbnf-formulation/SKILL.md", "tasks/{phase_slug}.md"]
  gate        = "All tests pass. ZBNF ratio assertions green if applicable. Coverage reasonable."

  [steps.3_reviewer]
  agent       = "reviewer"
  instruction = "Security and quality review for {phase}. Check OWASP minimums, Winston/loglevel/structlog present in every service file, .env-only secrets, Bangla-first UI strings, and parameterized SQL."
  reads       = ["CLAUDE.md", "AGENTS.md"]
  gate        = "Zero OWASP violations. No hardcoded secrets. Logger present everywhere."

  [steps.4_doc_updater]
  agent       = "doc-updater"
  instruction = "Update docs for {phase}: README.md (new commands/features), docs/architecture.md (if new service or table), docs/farmer-guide-bn-en.md (user-facing features in Bangla + English), and tick off completed items in tasks/{phase_slug}.md."
  reads       = ["docs/architecture.md", "docs/farmer-guide-bn-en.md", "README.md"]
  gate        = "All relevant documentation files updated. Task checklist reflects completion if it exists."

  [steps.5_committer]
  agent       = "committer"
  instruction = "Run ESLint (zero warnings), Prettier check, then test. If all pass, commit with conventional message: 'feat({phase_lower}): implement {phase} — {short_description}'."
  gate        = "npm run lint exits 0. npm run format:check exits 0. npx vitest run exits 0."

[notes]
never_skip   = "Never skip the pre-commit gate. Never pass --no-verify."
zbnf_warning = "If phase touches any formulation (ratios, schedules, thresholds) — coder MUST read skills/zbnf-formulation/SKILL.md first."
