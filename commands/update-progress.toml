[command]
name        = "update-progress"
description = "Update .session/progress.json to record a completed feature or module, set the current feature/module, and optionally add a note."
usage       = "@update-progress completed='bot-auth' current='weather-alerts' note='Authentication completed, weather Alerts started'"

[parameters]
completed = { type = "string", required = false, description = "Feature or module just finished. Added to the completed[] array." }
current   = { type = "string", required = false, description = "Feature or module now in progress. Sets the current field." }
note      = { type = "string", required = false, description = "Free-text note appended to the notes field." }

[steps]

  [steps.1_run_script]
  command     = "node scripts/update-progress.js --completed \"{completed}\" --current \"{current}\" --note \"{note}\""
  description = "Calls the update-progress script which reads and writes .session/progress.json atomically."
  fallback    = "If the script fails, manually edit .session/progress.json — see schema below."

[progress_json_schema]
completed    = "Array of feature/module IDs that are fully implemented and committed, e.g. ['bot-auth', 'weather-alerts']"
current      = "The feature or module currently being worked on, e.g. 'weather-alerts'"
last_updated = "ISO 8601 timestamp set automatically by the script"
notes        = "Free-text notes — append-only, newest last"

[example_state]
completed    = ["bot-auth", "weather-alerts"]
current      = "iot-telemetry"
last_updated = "2026-05-08T10:00:00Z"
notes        = "Weather alerts complete. Starting IoT telemetry setup."

[notes]
auto_save  = "The Claude Code Stop hook (/.claude/hooks/session-start.js) reads this file and prints status at session start."
gitignore  = ".session/ is in .gitignore — progress state is local only, not committed."
when_to_run = "Run immediately after the committer agent succeeds for a feature, before starting the next feature."
