name: Deploy Agriculture Assistant to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Get Repository Name
        id: repo-name
        run: echo "name=$(echo '${{ github.repository }}' | awk -F'/' '{print $2}')" >> $GITHUB_OUTPUT

      - name: Determine base path
        id: base-path
        run: |
          BASE_PATH="${{ steps.pages.outputs.base_path }}"
          if [ -z "$BASE_PATH" ]; then
            BASE_PATH="/${{ steps.repo-name.outputs.name }}"
          fi
          [[ "$BASE_PATH" != */ ]] && BASE_PATH="${BASE_PATH}/"
          [[ "$BASE_PATH" != /* ]] && BASE_PATH="/${BASE_PATH}"
          echo "base_path=${BASE_PATH}" >> $GITHUB_OUTPUT

      - name: Build client
        run: |
          cd client
          npm ci
          npm run build -- --base=${{ steps.base-path.outputs.base_path }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_PLANTNET_API_KEY: ${{ secrets.VITE_PLANTNET_API_KEY }}
          VITE_AUTH_ENDPOINT: ${{ secrets.VITE_AUTH_ENDPOINT }}
          VITE_BOT_USERNAME: ${{ secrets.VITE_BOT_USERNAME }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./client/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
