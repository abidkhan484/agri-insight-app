name: Daily ZBNF Cron

on:
  schedule:
    # 00:00 UTC is 06:00 BDT
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-cron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: src
      - name: Run daily reminder check
        run: node scripts/run-cron.js --job daily-reminder-check
        working-directory: src
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DB_PATH: ./data/zbnf.sqlite
